services:
  app:
    build: .
    container_name: travel-agency-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tours"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
