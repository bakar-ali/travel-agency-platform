services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-https://www.instagram.com/}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/}
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.travel-tour.rule=Host(`tour.hbdhamnah.site`)
      - traefik.http.routers.travel-tour.entrypoints=websecure
      - traefik.http.routers.travel-tour.tls=true
      - traefik.http.routers.travel-tour.tls.certresolver=letsencrypt
      - traefik.http.routers.travel-tour.service=travel-tour
      - traefik.http.services.travel-tour.loadbalancer.server.port=3000
      - traefik.http.routers.travel-tour-http.rule=Host(`tour.hbdhamnah.site`)
      - traefik.http.routers.travel-tour-http.entrypoints=web
      - traefik.http.routers.travel-tour-http.middlewares=travel-tour-redirect
      - traefik.http.middlewares.travel-tour-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.travel-tour-redirect.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tours"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  dokploy-network:
    external: true
