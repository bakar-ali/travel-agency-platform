services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-https://www.instagram.com/}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tours"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
